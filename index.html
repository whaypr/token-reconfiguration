<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>p-Fairness Graph Simulation</title>
</head>

<body>
    <div id="instructions">
        Orange nodes can accept a new token. Middle-click empty space to add a vertex, middle-click a vertex to remove it, right-drag from a vertex to create an edge, drag a vertex to move it, and left-drag the background to pan.
    </div>

    <div id="controls">
        <label>
            <strong>Scenario:</strong>
            <select id="scenarioSelect"></select>
        </label>
        <label>
            <strong>p (max tokens in closed neighborhood):</strong>
            <input type="number" id="pValue" value="2" min="0" max="10">
        </label>
        <label>
            <strong>Layout:</strong>
            <select id="layoutSelect">
                <option value="circular">Circular</option>
                <option value="tree">Tree</option>
                <option value="grid">Grid</option>
                <option value="spiral">Spiral</option>
                <option value="horizontal">Horizontal</option>
                <option value="vertical">Vertical</option>
            </select>
        </label>
        <label>
            <input type="checkbox" id="repulsionToggle">
            <strong>Repulsive force</strong>
        </label>
    </div>

    <div id="scenarioDescription"></div>

    <div id="status">Select a token to see legal moves.</div>

    <svg width="1000" height="800"></svg>

    <script type="module" src="/src/script.ts"></script>
</body>

</html>
